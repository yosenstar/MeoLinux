name: Build MeoLinux ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO
        uses: ublue-os/lorax-compose@v1.0.0
        id: build
        with:
          ostree-oci-ref: ghcr.io/fedora/fedora-silverblue:44
          fedora-release: 44
          output-dir: build

      - name: Generate checksum
        run: |
          cd build
          sha256sum *.iso > MeoLinux-44-x86_64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeoLinux-ISO
          path: build/*.iso
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.iso
            build/*.sha256
          draft: true
          generate_release_notes: true
