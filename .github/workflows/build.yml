name: Build MeoLinux ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO in Fedora container
        run: |
          rm -rf build
          docker run --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            fedora:44 bash -c "
              dnf install -y lorax lorax-lmc-novirt pykickstart xorriso &&
              ksvalidator kickstart/meolinux.ks &&
              mkdir -p build &&
              livemedia-creator --make-iso \
                --ks kickstart/meolinux.ks \
                --no-virt \
                --resultdir ./build/ \
                --project MeoLinux \
                --releasever 44 \
                --iso-name MeoLinux-44-x86_64.iso
            "

      - name: Generate checksum
        run: |
          cd build
          sha256sum *.iso > MeoLinux-44-x86_64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeoLinux-ISO
          path: build/*.iso
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.iso
            build/*.sha256
          draft: true
          generate_release_notes: true
