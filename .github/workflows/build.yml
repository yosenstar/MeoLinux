name: Build MeoLinux ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO in Fedora container
        run: |
          mkdir -p build
          docker run --privileged \
            -v ${{ github.workspace }}:/workspace \
            fedora:44 bash -c "
              set -ex

              echo '=== Installing dependencies ==='
              dnf install -y \
                lorax lorax-lmc-novirt pykickstart xorriso \
                anaconda anaconda-core anaconda-tui anaconda-install-img-deps \
                rpm-ostree dracut-live dracut-network \
                ostree wget fuse-libs &&

              ksvalidator /workspace/kickstart/meolinux.ks &&

              echo '=== Downloading Fedora Silverblue 44 ISO ==='
              wget -q --tries=3 \
                'https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Spins/x86_64/iso/Fedora-Silverblue-ostree-x86_64-44.iso' \
                -O /tmp/fedora-silverblue.iso || {
                  echo 'Primary mirror failed, trying alternative...'
                  wget -q --tries=3 \
                    'https://mirror.us-midwest-1.nexcess.net/fedora/linux/releases/44/Spins/x86_64/iso/Fedora-Silverblue-ostree-x86_64-44.iso' \
                    -O /tmp/fedora-silverblue.iso
                } &&

              echo '=== Extracting ostree repo from ISO ==='
              mkdir -p /tmp/sb-extract
              xorriso -osirrox on -indev /tmp/fedora-silverblue.iso -extract / /tmp/sb-extract 2>&1 | tail -20 &&

              echo '=== Finding ostree repo ==='
              find /tmp/sb-extract -maxdepth 4 -name 'objects' -type d 2>/dev/null | head -5 &&
              find /tmp/sb-extract -maxdepth 4 -name 'config' -path '*/repo/*' 2>/dev/null | head -5 &&

              echo '=== Copying ostree repo ==='
              if [ -d /tmp/sb-extract/ostree/repo/objects ]; then
                cp -a /tmp/sb-extract/ostree/repo /ostree/repo
              else
                echo 'ERROR: ostree repo not found in ISO'
                ls -la /tmp/sb-extract/ 2>/dev/null
                find /tmp/sb-extract -maxdepth 3 -type d 2>/dev/null | head -30
                exit 1
              fi &&

              rm -f /tmp/fedora-silverblue.iso &&

              echo '=== Building MeoLinux ISO ==='
              livemedia-creator --make-iso \
                --ks /workspace/kickstart/meolinux.ks \
                --no-virt \
                --resultdir /tmp/meolinux-build/ \
                --project MeoLinux \
                --releasever 44 \
                --iso-name MeoLinux-44-x86_64.iso &&

              cp /tmp/meolinux-build/*.iso /workspace/build/
            "

      - name: Generate checksum
        run: |
          cd build
          sha256sum *.iso > MeoLinux-44-x86_64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeoLinux-ISO
          path: build/*.iso
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.iso
            build/*.sha256
          draft: true
          generate_release_notes: true
