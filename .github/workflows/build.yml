name: Build MeoLinux ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO in Fedora container
        run: |
          mkdir -p build
          docker run --privileged \
            -v ${{ github.workspace }}:/workspace \
            fedora:44 bash -c "
              set -ex

              echo '=== Installing dependencies ==='
              dnf install -y \
                lorax lorax-lmc-novirt pykickstart xorriso \
                anaconda anaconda-core anaconda-tui anaconda-install-img-deps \
                rpm-ostree dracut-live dracut-network \
                ostree ostree-fuse wget &&

              ksvalidator /workspace/kickstart/meolinux.ks &&

              echo '=== Creating local ostree repo and pulling content ==='
              mkdir -p /ostree/repo
              ostree --repo=/ostree/repo init --mode=archive-z2

              echo '=== Adding Fedora remote ==='
              ostree --repo=/ostree/repo remote add --if-not-exists \
                fedora https://ostree.fedoraproject.org/silverblue

              echo '=== Pulling Fedora Silverblue 44 commit ==='
              ostree --repo=/ostree/repo pull \
                --depth=-1 \
                fedora fedora/44/x86_64/silverblue &&

              echo '=== Building MeoLinux ISO ==='
              livemedia-creator --make-iso \
                --ks /workspace/kickstart/meolinux.ks \
                --no-virt \
                --resultdir /tmp/meolinux-build/ \
                --project MeoLinux \
                --releasever 44 \
                --iso-name MeoLinux-44-x86_64.iso &&

              cp /tmp/meolinux-build/*.iso /workspace/build/
            "

      - name: Generate checksum
        run: |
          cd build
          sha256sum *.iso > MeoLinux-44-x86_64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeoLinux-ISO
          path: build/*.iso
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.iso
            build/*.sha256
          draft: true
          generate_release_notes: true
